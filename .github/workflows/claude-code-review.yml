name: Claude Code Review

# Automated first-pass review on every PR. Extra to the family core
# — same token-guard and stable-channel reasoning as
# claude.yml, see the comments there.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check token is configured
        id: token_check
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: echo "has_token=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code CLI (stable channel)
        if: steps.token_check.outputs.has_token == 'true'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s stable
          echo "CLAUDE_CODE_PATH=$HOME/.local/bin/claude" >> "$GITHUB_ENV"

      - uses: anthropics/claude-code-action@v1
        if: steps.token_check.outputs.has_token == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: ${{ env.CLAUDE_CODE_PATH }}
          prompt: |
            Review this PR for correctness against this repository's own
            invariants. Do not re-litigate them; if a change seems to
            conflict with one, explain the conflict instead of complying:
            - A run that finds nothing writes nothing (no overwrite of good
              output with an empty file unless --allow-empty).
            - Exit codes: 0 ok, 1 crash, 2 bad usage, 3 blocked, 4 genuinely
              empty, 5 nothing obtained (fetch/parse/remote failure),
              6 partial (rows, then a failure). Blocked, empty and partial
              must stay distinguishable, identically in all three engines.
            - Output files and the .meta.json sidecar are written atomically;
              CSV cells starting with = + - @ tab CR LF are escaped.
            - Never present a guess as a fact: unknown values are null.
            - Credentials never reach argv, logs or exception messages.
            - Paid captcha solves go through the run's one solve budget.
            Flag any product wording the smoke test bans (the remote browser
            product is the "Scraping Browser API"), output-contract drift in the Product
            row or sidecar, and anything that touches fetching or captcha
            handling without matching smoke_test.py coverage.
